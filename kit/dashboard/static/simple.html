<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Задача OpenCode</title>
</head>
<body>
  <main>
    <h1 id="title">Задача OpenCode</h1>
    <button id="refresh" type="button">Обновить</button>
    <p id="message" role="status"></p>
    <dl>
      <dt>Статус</dt><dd id="status">Нет данных</dd>
      <dt>События</dt><dd id="event-count">Нет данных</dd>
      <dt>Успешные рабочие прогоны / все рабочие</dt><dd id="runs">Нет данных</dd>
      <dt>Возвраты на доработку</dt><dd id="reworks">Нет данных</dd>
      <dt>Сбои исполнителя</dt><dd id="failures">Нет данных</dd>
    </dl>
  </main>
  <script>
    'use strict';

    async function loadTask() {
      const response = await fetch('/api/task');
      const data = await response.json();
      if (!response.ok) {
        throw new Error(data.error || response.statusText);
      }
      return data;
    }

    function renderTask(data) {
      const titleElement = document.getElementById('title');
      titleElement.textContent = data.title;
      const statusElement = document.getElementById('status');
      statusElement.textContent = data.status;
      if (data.status === 'running') {
        statusElement.textContent = 'В работе';
      } else if (data.status === 'halted') {
        statusElement.textContent = 'Остановлена';
      } else if (data.status === 'finished') {
        statusElement.textContent = 'Завершена';
      } else {
        statusElement.textContent = data.status;
      }
      
      const eventCountElement = document.getElementById('event-count');
      eventCountElement.textContent = data.event_count;
      const runsElement = document.getElementById('runs');

      const runsText = `${data.green_work_runs} / ${data.work_runs}`;
      runsElement.textContent = runsText;
      
      const reworksElement = document.getElementById('reworks');
      reworksElement.textContent = data.reworks;
      const failuresElement = document.getElementById('failures');
      failuresElement.textContent = data.executor_failures;
      
    }

    async function refreshTask() {
      const idButtonElement = document.getElementById('refresh');
      idButtonElement.disabled = true;
      const messageElement = document.getElementById('message');
      messageElement.textContent = '';
      try {
        const data = await loadTask();
        renderTask(data);
      } catch (error) {
        const messageElement = document.getElementById('message');
        messageElement.textContent = error.message;
      } finally {
        idButtonElement.disabled = false;
      }


    }

    function main() {
      const idButtonElement = document.getElementById('refresh');
      idButtonElement.addEventListener('click', refreshTask);
      refreshTask();
    }
    main();
  </script>
</body>
</html>
