name: Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'kit/**'
      - 'install.*'
      - 'AGENTS.md'
      - '.github/workflows/windows-installer.yml'
permissions:
  contents: read
jobs:
  pinned-runtime:
    runs-on: windows-2022
    env:
      OPENCODE_KIT_DASHBOARD: 'off'
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap without a Python launcher
        env:
          OPENCODE_KIT_RUNTIME_HOME: '${{ runner.temp }}\opencode-kit-runtimes'
        run: .\kit\python.cmd --kit-runtime-path
      - name: Verify native entry points and real Tk
        env:
          OPENCODE_KIT_RUNTIME_HOME: '${{ runner.temp }}\opencode-kit-runtimes'
        run: |
          .\kit\python.cmd -m kit.task_metrics start --task windows-installer --title 'Windows pinned runtime' --no-dashboard
          .\kit\python.cmd -m kit.task_metrics test --task windows-installer --scope bootstrap -- .\kit\python.cmd -m unittest kit.tests.test_python_runtime -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\kit\python.cmd -m kit.task_metrics test --task windows-installer --scope installer -- .\kit\python.cmd -m kit.tests.windows_runtime_smoke -v
